[tool.poetry]
name = "book-rec"
version = "0.2.0"
description = ""
authors = ["Tuan Pham <tuanqpham0921@gmail.com>"]
packages = [
    { include = "app" },
    { include = "common" },
    { include = "db" },
    { include = "config" }
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
log_cli_level = "INFO"
log_cli = true
testpaths = ["tests"]
markers = [
    "unit: fast, no I/O",
    "integration: requires running services",
]

[tool.poetry.dependencies]
python = "^3.11"
tiktoken = "^0.9.0"
pydantic-settings = "^2.9.1"
pydantic = "^2.11.5"
rich = "^14.0.0"
openai = "^1.82.1"
fastapi = { extras = ["standard"], version = "^0.115.12" }
sse-starlette = "^2.3.6"
uvicorn = "^0.35.0"
pandas = "^2.3.2"
pgvector = ">=0.2.0"
asyncpg = "^0.29.0"
sqlalchemy = ">=2.0.0"

[tool.poetry.group.dev.dependencies]
ipykernel = "^6.29.5"
pytest = "^8.0.0"
pytest-asyncio = "^0.23.0"
pytest-cov = "^7.0.0"
jupyter = "^1.1.1"
notebook = "^7.4.7"
ruff = "^0.15.20"
black = "^26.5.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
ingestion = "db.ingestion.main:main"
app = "app.main:main"