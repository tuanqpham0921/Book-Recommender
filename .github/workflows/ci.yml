name: Backend CI

on:
  push:
    branches:
      - add_github_action_tests

env:
  APP_NAME: book-recommender-backend
  APP_ENVIRONMENT: test
  APP_ALLOW_ORIGINS: http://localhost:3000

  POSTGRES_HOST: localhost
  POSTGRES_PORT: "5432"
  POSTGRES_DB: book_recommender_test
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  POSTGRES_MIN_CONNECTIONS: "1"
  POSTGRES_MAX_CONNECTIONS: "5"
  
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  OPENAI_BASE_MODEL: gpt-4.1-mini
  OPENAI_TOKENIZER_ENCODING: o200k_base
  OPENAI_EMBEDDING_MODEL: text-embedding-3-large
  OPENAI_EMBEDDING_DIMENSIONS: "1024"
  OPENAI_MAX_CONCURRENCY: "1"

defaults:
  run:
    working-directory: backend

jobs:
  backend-unit-tests:
    name: Backend unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: python -m pip install --upgrade pip poetry

      - name: Install dependencies
        run: poetry install --no-interaction --no-ansi

      - name: Run backend tests
        run: poetry run pytest tests

  backend-ingestion-smoke-tests:
    name: Backend ingestion smoke test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: book_recommender_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d book_recommender_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: python -m pip install --upgrade pip poetry

      - name: Install dependencies
        run: poetry install --no-interaction --no-ansi

      - name: Use smoke-test dataset
        run: cp data/test_books.csv data/books.csv

      - name: Run backend ingestion script
        run: LOG_LEVEL=INFO poetry run python -m ingestion.main