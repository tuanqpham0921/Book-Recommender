name: Backend CI

on:
  push:
    branches:
      - add_github_action_tests

jobs:
  backend-tests:
    name: Backend pytest
    runs-on: ubuntu-latest
    env:
      APP_NAME: ${{ vars.APP_NAME }}
      APP_ENVIRONMENT: ${{ vars.APP_ENVIRONMENT }}
      APP_ALLOW_ORIGINS: ${{ vars.APP_ALLOW_ORIGINS }}

      POSTGRES_HOST: ${{ vars.POSTGRES_HOST }}
      POSTGRES_PORT: ${{ vars.POSTGRES_PORT }}
      POSTGRES_DB: ${{ vars.POSTGRES_DB }}
      POSTGRES_USER: ${{ vars.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      POSTGRES_MIN_CONNECTIONS: ${{ vars.POSTGRES_MIN_CONNECTIONS }}
      POSTGRES_MAX_CONNECTIONS: ${{ vars.POSTGRES_MAX_CONNECTIONS }}
      
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_BASE_MODEL: ${{ vars.OPENAI_BASE_MODEL }}
      OPENAI_TOKENIZER_ENCODING: ${{ vars.OPENAI_TOKENIZER_ENCODING }}
      OPENAI_EMBEDDING_MODEL: ${{ vars.OPENAI_EMBEDDING_MODEL }}
      OPENAI_EMBEDDING_DIMENSIONS: ${{ vars.OPENAI_EMBEDDING_DIMENSIONS }}
      OPENAI_MAX_CONCURRENCY: ${{ vars.OPENAI_MAX_CONCURRENCY }}

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: python -m pip install --upgrade pip poetry

      - name: Install dependencies
        run: poetry install --no-interaction --no-ansi

      - name: Run backend tests
        run: poetry run pytest tests
