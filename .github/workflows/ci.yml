name: Backend CI

on:
  push:
    branches:
      - add_github_action_tests

env:
  APP_NAME: book-recommender-backend
  APP_ENVIRONMENT: test
  APP_ALLOW_ORIGINS: http://localhost:3000

  POSTGRES_HOST: localhost
  POSTGRES_PORT: "5432"
  POSTGRES_DB: book_recommender_test
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: test_password
  POSTGRES_MIN_CONNECTIONS: "1"
  POSTGRES_MAX_CONNECTIONS: "5"
  
  OPENAI_API_KEY: test_key
  OPENAI_BASE_MODEL: gpt-4.1-mini
  OPENAI_TOKENIZER_ENCODING: o200k_base
  OPENAI_EMBEDDING_MODEL: text-embedding-3-large
  OPENAI_EMBEDDING_DIMENSIONS: "1024"
  OPENAI_MAX_CONCURRENCY: "1"

defaults:
  run:
    working-directory: backend

jobs:
  backend-unit-tests:
    name: Backend unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: python -m pip install --upgrade pip poetry

      - name: Install dependencies
        run: poetry install --no-interaction --no-ansi

      - name: Check Python syntax
        run: poetry run python -m compileall .

      - name: Run backend tests
        run: poetry run pytest tests/unit